<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GrowSync - Mis invernaderos</title>

    <link rel="stylesheet" href="css/growsync.css">

</head>


<body>

    <header class="topbar">

        <div class="brand">

            <button
                type="button"
                class="menu-button"
                id="menuButton"
                aria-label="Abrir menú"
            >
                🌱
            </button>
        
            <span>GrowSync</span>
        
        </div>


        <div class="topbar-actions">

            <button
                class="theme-button small"
                id="themeButton"
            >
                🌙
            </button>

            <div class="user-avatar" id="userAvatar">
                U
            </div>

        </div>

    </header>

<nav class="side-menu" id="sideMenu">

    <a href="invernaderos.html" class="side-menu-item">
        <span class="side-menu-icon">🌱</span>
        <span>Invernaderos</span>
    </a>

    <button type="button" class="side-menu-item" id="settingsButton">
        <span class="side-menu-icon">⚙️</span>
        <span>Ajustes</span>
    </button>

</nav>

    <main class="greenhouses-page">

        <section class="page-header">

            <div>

                <span class="page-label">
                    MI CUENTA
                </span>

                <h1>
                    Mis invernaderos
                </h1>

                <p>
                    Gestiona todos tus invernaderos desde un único lugar.
                </p>

            </div>


            <button
                class="primary-button"
                id="addGreenhouseButton"
            >
                + Añadir invernadero
            </button>

        </section>


        <section
            class="greenhouses-grid"
            id="greenhousesContainer"
        >

            <!-- Los invernaderos se cargarán mediante JavaScript -->

        </section>

    </main>


    <!-- MODAL -->

    <div
        class="modal-overlay"
        id="greenhouseModal"
    >

        <div class="modal">

            <button
                class="modal-close"
                id="closeModal"
            >
                ×
            </button>


            <div class="modal-icon">
                🌱
            </div>

            <h2>
                Añadir invernadero
            </h2>

            <p>
                Elige cómo quieres añadir tu invernadero.
            </p>


            <div class="modal-options">

                <button
                    class="modal-option"
                    id="createGreenhouse"
                >

                    <span class="option-icon">
                        ➕
                    </span>

                    <div>
                        <strong>
                            Crear un invernadero
                        </strong>

                        <small>
                            Crea un nuevo sistema GrowSync
                        </small>
                    </div>

                </button>


                <button
                    class="modal-option"
                    id="joinGreenhouse"
                >

                    <span class="option-icon">
                        🔗
                    </span>

                    <div>
                        <strong>
                            Unirme a un invernadero
                        </strong>

                        <small>
                            Introduce el código de otro invernadero
                        </small>
                    </div>

                </button>

            </div>

        </div>

    </div>


    <script
        src="js/firebase.js"
        type="module"
    ></script>

    <script
        src="js/invernaderos.js"
        type="module"
    ></script>

</body>
</html>
