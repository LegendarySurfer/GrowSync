<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrowSync - Crear cuenta</title>

    <link rel="stylesheet" href="css/growsync.css">
</head>

<body class="login-page">

    <button class="theme-button floating" id="themeButton">
        🌙
    </button>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                🌱
            </div>

            <h1>Crear cuenta</h1>

            <p class="login-subtitle">
                Regístrate para gestionar tus invernaderos
            </p>

            <form id="registroForm">

                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@correo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" id="passwordToggle">👁</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password2">Repite la contraseña</label>
                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="Repite la contraseña"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="primary-button login-button">
                    Crear cuenta
                </button>

            </form>

            <div class="login-message" id="registroMessage"></div>

            <div class="login-links">
                <span>¿Ya tienes una cuenta?</span>
                <a href="index.html" class="link-button" style="text-decoration:none; text-align:center;">
                    Iniciar sesión
                </a>
            </div>

        </section>

    </main>

    <script src="js/registro.js" type="module"></script>
</body>
</html>
