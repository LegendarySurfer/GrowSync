<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GrowSync - Iniciar sesión</title>


    <style>

        :root {

            --primary: #39a96b;
            --primary-dark: #2d8b57;
            --primary-light: #e9f8ef;

            --background: #f5f7f6;
            --surface: #ffffff;

            --text: #17231c;
            --text-secondary: #68736d;

            --border: #e4e9e6;

            --danger: #e05252;

            --shadow:
                0 15px 40px rgba(28, 45, 35, 0.09);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:

                radial-gradient(
                    circle at 10% 10%,
                    rgba(57,169,107,.12),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(57,169,107,.08),
                    transparent 35%
                ),

                var(--background);

            color: var(--text);

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .theme-button {

            position: fixed;

            top: 25px;
            right: 25px;

            width: 44px;
            height: 44px;

            border-radius: 50%;

            border: 1px solid var(--border);

            background: var(--surface);

            cursor: pointer;

            font-size: 18px;

            box-shadow: var(--shadow);
        }


        .login-card {

            width: 100%;

            max-width: 430px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 42px;

            box-shadow: var(--shadow);
        }


        .brand {

            text-align: center;

            margin-bottom: 35px;
        }


        .brand-icon {

            width: 64px;
            height: 64px;

            margin: auto;

            margin-bottom: 14px;

            border-radius: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: var(--primary-light);

            font-size: 32px;
        }


        .brand h1 {

            font-size: 29px;

            letter-spacing: -.7px;
        }


        .brand p {

            margin-top: 7px;

            color: var(--text-secondary);

            font-size: 14px;
        }


        .title {

            margin-bottom: 24px;
        }


        .title h2 {

            font-size: 23px;
        }


        .title p {

            margin-top: 6px;

            color: var(--text-secondary);

            font-size: 14px;

            line-height: 1.5;
        }


        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border-radius: 11px;

            border: 1px solid var(--border);

            background: var(--background);

            color: var(--text);

            outline: none;

            font-size: 14px;
        }


        input:focus {

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(57,169,107,.12);
        }


        .password-toggle {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 17px;
        }


        .forgot {

            display: block;

            margin-left: auto;

            margin-bottom: 22px;

            border: none;

            background: none;

            color: var(--primary);

            font-weight: 600;

            font-size: 13px;

            cursor: pointer;
        }


        .primary-button {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 11px;

            background: var(--primary);

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }


        .primary-button:hover {

            background: var(--primary-dark);

            transform: translateY(-1px);
        }


        .register {

            text-align: center;

            margin-top: 25px;

            color: var(--text-secondary);

            font-size: 13px;
        }


        .register a {

            color: var(--primary);

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }


        .message {

            display: none;

            margin-bottom: 17px;

            padding: 11px;

            border-radius: 9px;

            font-size: 13px;
        }


        .message.error {

            display: block;

            background: rgba(224,82,82,.1);

            color: var(--danger);
        }


        @media(max-width:500px) {

            .login-card {

                padding: 30px 23px;
            }

        }

    </style>

</head>


<body>


<button
    class="theme-button"
    onclick="toggleTheme()"
    id="themeButton">

    ☾

</button>


<div class="login-card">


    <div class="brand">

        <div class="brand-icon">

            🌱

        </div>

        <h1>

            GrowSync

        </h1>

        <p>

            Gestión inteligente de tu invernadero

        </p>

    </div>


    <div class="title">

        <h2>

            Bienvenido de nuevo

        </h2>

        <p>

            Accede a tu cuenta para gestionar
            tus invernaderos.

        </p>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div class="form-group">

        <label for="email">

            Correo electrónico

        </label>

        <input
            id="email"
            type="email"
            placeholder="tu@email.com">

    </div>


    <div class="form-group">

        <label for="password">

            Contraseña

        </label>


        <div class="input-wrapper">

            <input
                id="password"
                type="password"
                placeholder="Introduce tu contraseña">


            <button
                class="password-toggle"
                onclick="togglePassword()">

                👁

            </button>

        </div>

    </div>


    <button
        class="forgot"
        onclick="forgotPassword()">

        ¿Has olvidado tu contraseña?

    </button>


    <button
        class="primary-button"
        onclick="login()">

        ENTRAR

    </button>


    <div class="register">

        ¿No tienes una cuenta?

        <a onclick="register()">

            Crear cuenta

        </a>

    </div>

</div>


<script>

function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        showMessage(
            "Introduce tu correo y contraseña."
        );

        return;
    }


    /*
        TEMPORAL

        Aquí conectaremos Firebase:

        signInWithEmailAndPassword(
            auth,
            email,
            password
        )
    */


    window.location.href =
        "invernaderos.html";
}


function register() {

    alert(
        "Aquí añadiremos la pantalla de registro."
    );
}


function forgotPassword() {

    alert(
        "Aquí añadiremos la recuperación de contraseña."
    );
}


function togglePassword() {

    const input =
        document.getElementById("password");


    input.type =
        input.type === "password"
            ? "text"
            : "password";
}


function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message error";
}


function toggleTheme() {

    document.body.classList.toggle("dark");

}

</script>


</body>

</html>
