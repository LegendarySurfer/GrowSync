<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GrowSync</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg: #101914;
    --sidebar: #142019;
    --card: #17241C;
    --card-hover: #1c2b22;
    --border: #2A3A2F;
    --text: #E6EFE7;
    --text-secondary: #8FA697;
    --green: #8BE000;
    --green-dark: #1d351f;
    --danger: #ffb000;
    --shadow: rgba(0, 0, 0, 0.25);
  }
 /* La planta funciona como botón */
.brand-icon {
  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background: var(--green-dark);
  border: 1px solid var(--green);

  color: var(--green);

  font-size: 20px;

  cursor: pointer;

  transition: 0.2s;
}

.brand-icon:hover {
  transform: scale(1.05);
  background: var(--card-hover);
}


/* PANEL CERRADO */

.sidebar {
  transform: translateX(-100%);
}


/* PANEL ABIERTO */

.sidebar.open {
  transform: translateX(0);
}


/* El contenido ocupa toda la pantalla cuando el panel está cerrado */

.main {
  margin-left: 0;
  padding: 100px 30px 40px;

  min-height: 100vh;

  transition: margin-left 0.25s ease;
}


/* Cuando el panel está abierto */

body.sidebar-open .main {
  margin-left: 245px;
}

  /* =========================
     MODO CLARO
  ========================= */

  body.light {
    --bg: #f2f5f3;
    --sidebar: #ffffff;
    --card: #ffffff;
    --card-hover: #f4f7f5;
    --border: #dce5df;
    --text: #17241C;
    --text-secondary: #65756b;
    --green: #5e9f00;
    --green-dark: #edf6df;
    --danger: #c98200;
    --shadow: rgba(0, 0, 0, 0.08);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* =========================
     CABECERA SUPERIOR
  ========================= */

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    background: var(--sidebar);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    z-index: 100;

    transition: background 0.25s ease;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: var(--green-dark);
    border: 1px solid var(--green);

    color: var(--green);

    font-size: 20px;
  }

  .brand-text h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .brand-text p {
    font-size: 11px;
    margin: 2px 0 0;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* =========================
     BOTÓN TEMA
  ========================= */

  .theme-button {
    border: 1px solid var(--border);
    background: var(--card);

    color: var(--text);

    border-radius: 10px;

    height: 40px;
    padding: 0 14px;

    display: flex;
    align-items: center;
    gap: 8px;

    cursor: pointer;

    font-size: 13px;
    font-weight: 600;

    transition: 0.2s;
  }

  .theme-button:hover {
    background: var(--card-hover);
    border-color: var(--green);
  }

  /* =========================
     BARRA LATERAL
  ========================= */

  .sidebar {
    position: fixed;

    left: 0;
    top: 72px;
    bottom: 0;

    width: 245px;

    background: var(--sidebar);
    border-right: 1px solid var(--border);

    padding: 22px 14px;

    z-index: 90;

    transition:
      width 0.25s ease,
      transform 0.25s ease,
      background 0.25s ease;
  }

  .sidebar-title {
    font-size: 10px;
    color: var(--text-secondary);

    text-transform: uppercase;
    letter-spacing: 0.15em;

    padding: 0 12px;
    margin-bottom: 10px;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .menu-button {
    width: 100%;

    border: 1px solid transparent;

    background: transparent;
    color: var(--text-secondary);

    border-radius: 10px;

    padding: 11px 12px;

    display: flex;
    align-items: center;
    gap: 12px;

    cursor: pointer;

    text-align: left;

    font-size: 13px;
    font-weight: 600;

    transition: 0.2s;
  }

  .menu-button:hover {
    background: var(--card-hover);
    color: var(--text);
  }

  .menu-button.active {
    background: var(--green-dark);
    border-color: rgba(139, 224, 0, 0.25);
    color: var(--green);
  }

  .menu-icon {
    width: 20px;
    text-align: center;
    font-size: 16px;
  }

  /* =========================
     CONTENIDO
  ========================= */

  .main {
    margin-left: 245px;

    padding: 100px 30px 40px;

    min-height: 100vh;

    transition: margin-left 0.25s ease;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    margin-bottom: 28px;
  }

  .page-header h2 {
    margin: 0;

    font-size: 26px;
    letter-spacing: -0.02em;
  }

  .page-header p {
    margin: 5px 0 0;

    color: var(--text-secondary);

    font-size: 13px;
  }

  .connection-status {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #00d99b;

    font-size: 12px;
    font-weight: 600;
  }

  .connection-dot {
    width: 7px;
    height: 7px;

    background: #00d99b;

    border-radius: 50%;
  }

  /* =========================
     TARJETA TEMPERATURA
  ========================= */

  .card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 40px 56px;

    text-align: center;

    max-width: 600px;

    box-shadow: 0 10px 30px var(--shadow);

    transition:
      background 0.25s ease,
      border 0.25s ease;
  }

  .card h3 {
    font-size: 14px;
    font-weight: 500;

    color: var(--text-secondary);

    margin: 0 0 12px;

    letter-spacing: 0.01em;
  }

  .temp {
    font-size: min(72px, 14vw);

    font-weight: 800;

    margin: 0;

    line-height: 1;

    letter-spacing: -0.02em;
  }

  .temp span {
    font-size: 0.4em;

    font-weight: 600;

    color: var(--text-secondary);

    margin-left: 2px;
  }

  .status {
    margin-top: 14px;

    font-size: 13px;

    color: var(--text-secondary);
  }

  /* =========================
     FUTURAS TARJETAS
  ========================= */

  .dashboard-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(250px, 1fr));

    gap: 18px;

    margin-top: 20px;
  }

  .placeholder {
    min-height: 150px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: var(--text-secondary);

    font-size: 13px;
  }

  /* =========================
     RESPONSIVE
  ========================= */

  @media (max-width: 800px) {

    .sidebar {
      width: 210px;
    }

    .main {
      margin-left: 210px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .dashboard-grid {
      grid-template-columns: 1fr;
    }

  }

  @media (max-width: 650px) {

    .sidebar {
      transform: translateX(-100%);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .main {
      margin-left: 0;
      padding: 95px 16px 30px;
    }

    .topbar {
      padding: 0 16px;
    }

    .brand-text p {
      display: none;
    }

    .page-header {
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      padding: 35px 20px;
    }

  }

</style>
</head>

<body>

<!-- =====================================================
     CABECERA
===================================================== -->

<header class="topbar">

  <div class="brand">

   <button class="brand-icon" id="menuToggle" onclick="toggleSidebar()">
   🌱
   </button>

    <div class="brand-text">
      <h1>GrowSync</h1>
      <p>Smart Greenhouse</p>
    </div>

  </div>


  <!-- BOTÓN CLARO / OSCURO -->

  <button
    class="theme-button"
    id="themeButton"
    onclick="cambiarTema()">

    <span id="themeIcon">☀️</span>

    <span id="themeText">Modo claro</span>

  </button>

</header>


<!-- =====================================================
     BARRA LATERAL
===================================================== -->

<aside class="sidebar" id="sidebar">

  <div class="sidebar-title">
    Navegación
  </div>

  <nav class="menu">

  <button class="menu-button active">
    <span class="menu-icon">▦</span>
    <span>Dashboard</span>
  </button>

  <button class="menu-button">
    <span class="menu-icon">⚙</span>
    <span>Configuración</span>
  </button>

</nav>

</aside>


<!-- =====================================================
     CONTENIDO PRINCIPAL
===================================================== -->

<main class="main">

  <div class="page-header">

    <div>

      <h2>Dashboard</h2>

      <p>
        Monitorización del invernadero en tiempo real
      </p>

    </div>


    <div class="connection-status">

      <span class="connection-dot"></span>

      Sistema online

    </div>

  </div>


  <!-- =================================================
       TEMPERATURA
  ================================================== -->

  <div class="card">

    <h3>
      Temperatura del invernadero
    </h3>

    <p class="temp" id="temp">
      --<span>°C</span>
    </p>

    <p class="status" id="status">
      Conectando…
    </p>

  </div>


  <!-- =================================================
       ESPACIO PARA LAS FUTURAS TARJETAS
  ================================================== -->

  <div class="dashboard-grid">

    <div class="placeholder">
      Humedad ambiental
    </div>

    <div class="placeholder">
      Humedad del suelo
    </div>

    <div class="placeholder">
      Luminosidad
    </div>

    <div class="placeholder">
      Nivel del tanque
    </div>

    <div class="placeholder">
      Carga de batería
    </div>

    <div class="placeholder">
      Generación solar
    </div>

  </div>

</main>


<script>

/* =====================================================
   FIREBASE
===================================================== */

// CONFIGURA ESTO:
// La misma URL de Firebase de tu ESP32,
// terminada en /sensores.json

const FIREBASE_URL =
  "https://TU-PROYECTO-default-rtdb.europe-west1.firebasedatabase.app/sensores.json";


/* =====================================================
   ACTUALIZAR TEMPERATURA
===================================================== */

async function actualizar() {

  try {

    const res = await fetch(FIREBASE_URL);

    const data = await res.json();

    if (
      data &&
      data.temperatura !== undefined
    ) {

      document.getElementById("temp").innerHTML =
        Number(data.temperatura).toFixed(1)
        + "<span>°C</span>";

      document.getElementById("status").textContent =
        "Última lectura recibida correctamente";

    } else {

      document.getElementById("status").textContent =
        "Firebase responde pero sin datos todavía";

    }

  }

  catch (e) {

    document.getElementById("status").textContent =
      "Sin conexión con el sensor";

  }

}


/* =====================================================
   MODO CLARO / OSCURO
===================================================== */

function cambiarTema() {

  document.body.classList.toggle("light");

  const modoClaro =
    document.body.classList.contains("light");


  if (modoClaro) {

    document.getElementById("themeIcon").textContent = "🌙";

    document.getElementById("themeText").textContent =
      "Modo oscuro";

    localStorage.setItem("tema", "claro");

  }

  else {

    document.getElementById("themeIcon").textContent = "☀️";

    document.getElementById("themeText").textContent =
      "Modo claro";

    localStorage.setItem("tema", "oscuro");

  }

}


/* =====================================================
   CARGAR TEMA GUARDADO
===================================================== */

function cargarTema() {

  const tema =
    localStorage.getItem("tema");


  if (tema === "claro") {

    document.body.classList.add("light");

    document.getElementById("themeIcon").textContent =
      "🌙";

    document.getElementById("themeText").textContent =
      "Modo oscuro";

  }

}


/* =====================================================
   MENÚ LATERAL
===================================================== */

const botonesMenu =
  document.querySelectorAll(".menu-button");


botonesMenu.forEach(boton => {

  boton.addEventListener("click", function() {

    botonesMenu.forEach(b => {
      b.classList.remove("active");
    });

    this.classList.add("active");

    // De momento los botones no hacen nada más.
    // Posteriormente podremos cargar cada sección.

  });

});

/* =====================================================
   ABRIR / CERRAR BARRA LATERAL
===================================================== */

function toggleSidebar() {

  const sidebar = document.getElementById("sidebar");

  sidebar.classList.toggle("open");

  document.body.classList.toggle(
    "sidebar-open"
  );

}
/* =====================================================
   INICIO
===================================================== */

cargarTema();

actualizar();

setInterval(actualizar, 5000);

</script>

</body>
</html>
