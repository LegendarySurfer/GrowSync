<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrowSync - Iniciar sesión</title>

    <link rel="stylesheet" href="css/growsync.css">
</head>

<body class="login-page">

    <button class="theme-button" id="themeButton">
        🌙
    </button>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                🌱
            </div>

            <h1>GrowSync</h1>

            <p class="login-subtitle">
                Sistema inteligente para tu invernadero
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Introduce tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Introduce tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-button login-button"
                >
                    Iniciar sesión
                </button>

            </form>


            <div
                class="login-message"
                id="loginMessage"
            ></div>


            <div class="login-links">

                <button
                    type="button"
                    class="link-button"
                    id="forgotPassword"
                >
                    ¿Has olvidado tu contraseña?
                </button>

                <span>¿No tienes una cuenta?</span>

                <button
                    type="button"
                    class="link-button"
                    id="createAccount"
                >
                    Crear cuenta
                </button>

            </div>

        </section>

    </main>


    <script src="js/auth.js" type="module"></script>
    <script src="js/firebase.js" type="module"></script>

</body>
</html>
