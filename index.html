<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invernadero — Temperatura en vivo</title>
<style>
  *{box-sizing:border-box}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#101914;color:#E6EFE7;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;padding:20px;
  }
  .card{
    background:#17241C;border:1px solid #2A3A2F;border-radius:16px;
    padding:40px 56px;text-align:center;max-width:90vw;
  }
  h1{font-size:14px;font-weight:500;color:#8FA697;margin:0 0 12px;letter-spacing:.01em}
  .temp{font-size:min(72px,14vw);font-weight:800;margin:0;line-height:1;letter-spacing:-.02em}
  .temp span{font-size:.4em;font-weight:600;color:#8FA697;margin-left:2px}
  .status{margin-top:14px;font-size:13px;color:#8FA697}
</style>
</head>
<body>
  <div class="card">
    <h1>Temperatura del invernadero</h1>
    <p class="temp" id="temp">--<span>°C</span></p>
    <p class="status" id="status">Conectando…</p>
  </div>

<script>
// CONFIGURA ESTO: la misma URL de Firebase de tu ESP32, terminada en /sensores.json
const FIREBASE_URL = "https://TU-PROYECTO-default-rtdb.europe-west1.firebasedatabase.app/sensores.json";

async function actualizar(){
  try{
    const res = await fetch(FIREBASE_URL);
    const data = await res.json();
    if(data && data.temperatura !== undefined){
      document.getElementById("temp").innerHTML = data.temperatura.toFixed(1) + "<span>°C</span>";
      document.getElementById("status").textContent = "Última lectura recibida correctamente";
    } else {
      document.getElementById("status").textContent = "Firebase responde pero sin datos todavía";
    }
  }catch(e){
    document.getElementById("status").textContent = "Sin conexión con el sensor";
  }
}
actualizar();
setInterval(actualizar, 5000);
</script>
</body>
</html>
