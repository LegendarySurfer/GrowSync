<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - GrowSync</title>

    <link rel="stylesheet" href="css/growsync.css">
</head>

<body>

    <!-- =====================================================
         BOTÓN DE TEMA
         ===================================================== -->

    <button
        class="theme-button"
        id="themeButton"
        type="button"
    >
        🌙
    </button>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
         ===================================================== -->

    <main class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">
                🌱
            </div>


            <!-- TÍTULO -->
            <h1>
                Recuperar contraseña
            </h1>


            <!-- DESCRIPCIÓN -->
            <p class="auth-subtitle">
                Introduce tu correo electrónico y te enviaremos
                un enlace para restablecer tu contraseña.
            </p>


            <!-- =================================================
                 FORMULARIO
                 ================================================= -->

            <form id="recoverForm">

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Enviar enlace
                </button>

            </form>


            <!-- =================================================
                 MENSAJE
                 ================================================= -->

            <p
                id="recoverMessage"
                class="auth-message"
            ></p>


            <!-- =================================================
                 VOLVER AL LOGIN
                 ================================================= -->

            <div class="auth-footer">

                <a href="index.html">
                    ← Volver al inicio de sesión
                </a>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        type="module"
        src="js/recuperar.js">
    </script>

</body>

</html>
