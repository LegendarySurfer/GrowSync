<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar contraseña - GrowSync</title>

    <link
        rel="stylesheet"
        href="css/growsync.css"
    >

</head>


<body>

    <!-- =====================================================
         BOTÓN TEMA
         ===================================================== -->

    <button
        class="theme-button floating"
        id="themeButton"
        type="button"
    >
        🌙
    </button>


    <!-- =====================================================
         PÁGINA RECUPERACIÓN
         ===================================================== -->

    <main class="login-page">

        <div class="login-container">

            <div class="login-card">


                <!-- LOGO -->

                <div class="login-logo">
                    🌱
                </div>


                <!-- TÍTULO -->

                <h1>
                    Recuperar contraseña
                </h1>


                <!-- SUBTÍTULO -->

                <p class="login-subtitle">

                    Introduce tu correo electrónico y te
                    enviaremos un enlace para restablecer
                    tu contraseña.

                </p>


                <!-- =================================================
                     FORMULARIO
                     ================================================= -->

                <form id="recoverForm">


                    <!-- CORREO -->

                    <div class="input-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        class="primary-button login-button"
                    >
                        Enviar enlace
                    </button>


                </form>


                <!-- =================================================
                     MENSAJE
                     ================================================= -->

                <p
                    id="recoverMessage"
                    class="login-message"
                ></p>


                <!-- =================================================
                     VOLVER
                     ================================================= -->

                <div class="login-links">
                
                    <button
                        type="button"
                        class="link-button"
                        id="backToLogin"
                    >
                        ← Volver al inicio de sesión
                    </button>
                
                </div>


            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        type="module"
        src="js/recuperar.js"
    ></script>

</body>

</html>
